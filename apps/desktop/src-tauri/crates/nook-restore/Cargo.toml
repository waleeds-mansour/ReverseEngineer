[package]
# Puts back the windows Nook arranged (docs/nook-wm.md, D75). The window manager in `handy`, the
# `--nook-restore-windows` CLI and nook-guard.exe share this one journal and restore, so a window
# comes back the same way whoever notices that Nook stopped. Hearth's own code.
name = "nook-restore"
version = "0.1.0"
description = "Puts back the windows Nook arranged"
authors = ["Hearth"]
edition = "2021"
license = "MIT"
publish = false

# Its own workspace and Cargo.lock: the guard is built on its own before `tauri build`, and
# `handy` can still use the library as a path dependency.
[workspace]

[lib]
name = "nook_restore"
path = "src/lib.rs"

[[bin]]
name = "nook-guard"
path = "src/bin/nook-guard.rs"

[features]
# FakeDesktop and FakeSignals, for tests here and in `handy`.
fake = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only the Win32 parts the restore touches, so the guard stays small.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# The private-desktop tests, nook-testwin and the kill tests make their own desktop and windows,
# start programs on it and measure the guard.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = [
  "Wdk_System_SystemInformation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_WindowsProgramming",
] }
