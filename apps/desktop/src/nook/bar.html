<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <!-- Nook's bar: nothing loads from anywhere but Hearth's bundle, and it talks only to
         Tauri's IPC. Vite's dev server drops this tag (vite.config.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nook bar</title>
  </head>
  <body>
    <div
      id="bar"
      class="nb re-bar re-glass"
      role="toolbar"
      aria-label="Nook"
    ></div>
    <script type="module" src="/src/nook/bar.ts"></script>
  </body>
</html>
