<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <!-- Nook's own page: nothing loads from anywhere but Hearth's bundle, and it talks only to
         Tauri's IPC. Vite's dev server drops this tag (vite.config.ts), since it injects its own
         scripts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/nook/panel.tsx"></script>
  </body>
</html>
